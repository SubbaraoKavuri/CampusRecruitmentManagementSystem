<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173b32">
  <title>Campusly — Recruitment workspace</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="authRoot"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#overview" aria-label="Campusly home">
        <span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 29 10.5v11L16 29 3 21.5v-11L16 3Z"/><path d="m9 17 4.3 4L23 11"/></svg></span>
        <span class="brand-word">campusly<span>.</span><small>CAREER SERVICES</small></span>
      </a>
      <div class="workspace-label">WORKSPACE</div>
      <nav class="primary-nav" aria-label="Main navigation">
        <div id="navItems"></div>
      </nav>
      <div class="sidebar-bottom">
        <div class="season-card"><div class="season-top"><span class="season-dot"></span>PLACEMENT SEASON</div><strong>Fall 2026</strong><div class="season-progress"><span></span></div><div class="season-meta"><span>Season progress</span><b>68%</b></div></div>
        <button class="help-link" id="helpButton"><span>?</span>Help &amp; support <span class="external">↗</span></button>
        <div class="profile-mini"><div class="avatar avatar-admin" id="profileAvatar">CS</div><div class="profile-copy"><b id="profileName">Campus user</b><small id="profileRole">Career workspace</small></div><button class="more-button" id="logoutButton" aria-label="Sign out" title="Sign out">↪</button></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Open navigation">☰</button>
        <div class="breadcrumbs"><span>Workspace</span><i>/</i><b id="crumbPage">Overview</b></div>
        <div class="top-actions">
          <label class="search-box"><span>⌕</span><input id="globalSearch" type="search" placeholder="Search this page..." aria-label="Search current page"></label>
          <div class="top-divider"></div>
          <button class="term-button"><span class="term-dot"></span>2026–27 <span class="chevron">⌄</span></button>
        </div>
      </header>
      <section class="content" id="pageContent" aria-live="polite"></section>
      <footer class="footer"><span>© 2026 Campusly</span><span><i class="live-dot"></i> Secure career workspace</span><a href="/swagger-ui/index.html" target="_blank" rel="noreferrer">API docs ↗</a></footer>
    </main>
  </div>
  <div class="modal-root" id="modalRoot"></div>
  <div class="toast-root" id="toastRoot" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
